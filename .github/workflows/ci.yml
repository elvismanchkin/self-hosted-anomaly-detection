name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROMETHEUS_VERSION: 3.14.0
  ALERTMANAGER_VERSION: 0.34.0
  OTELCOL_VERSION: 0.160.0
  PROMQL_ANOMALY_DETECTION_VERSION: 0.2.1 # upstream rules, fetched (not vendored), see poc/README.md

jobs:
  go:
    name: anomalyd (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anomalyd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: anomalyd/go.mod
          cache-dependency-path: anomalyd/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/anomalyd

  python:
    name: PoC scripts (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poc/*/requirements.txt
      - uses: actions/setup-go@v6
        with:
          go-version-file: anomalyd/go.mod
          cache-dependency-path: anomalyd/go.sum
      - name: install requirements
        run: pip install -r poc/ml/requirements.txt -r poc/logs/requirements.txt
      - name: compile
        run: python -m py_compile $(git ls-files '*.py')
      - name: Tier-2 scorer self-test
        run: python poc/ml/prom_anomaly_job.py --selftest
      - name: Go detector matches the Python reference scorer
        run: |
          fx=$(mktemp -d)
          (cd anomalyd && ANOMALYD_FIXTURE_DIR="$fx" go test -count=1 ./internal/detect -run Parity)
          python anomalyd/internal/detect/testdata/parity.py "$fx" | tee parity.txt
          ref=$(tr -s ' ' < anomalyd/internal/detect/seasonal_test.go)
          fail=0
          while IFS= read -r line; do
            want=${line%%,  //*}
            grep -qF -- "$want" <<<"$ref" || { echo "::error::pyRef out of date: $want"; fail=1; }
          done < parity.txt
          exit $fail
      - name: cost tables in sync with docs/cost_model.py
        run: |
          python docs/cost_model.py --write >/dev/null
          git diff --exit-code || { echo "::error::run 'python3 docs/cost_model.py --write' and commit"; exit 1; }

  configs:
    name: Prometheus, Alertmanager, OTel configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install promtool, amtool, otelcol-contrib
        run: |
          mkdir -p "$HOME/bin"
          gh=https://github.com
          curl -sSfL "$gh/prometheus/prometheus/releases/download/v$PROMETHEUS_VERSION/prometheus-$PROMETHEUS_VERSION.linux-amd64.tar.gz" |
            tar xz -C "$HOME/bin" --strip-components=1 "prometheus-$PROMETHEUS_VERSION.linux-amd64/promtool"
          curl -sSfL "$gh/prometheus/alertmanager/releases/download/v$ALERTMANAGER_VERSION/alertmanager-$ALERTMANAGER_VERSION.linux-amd64.tar.gz" |
            tar xz -C "$HOME/bin" --strip-components=1 "alertmanager-$ALERTMANAGER_VERSION.linux-amd64/amtool"
          curl -sSfL "$gh/open-telemetry/opentelemetry-collector-releases/releases/download/v$OTELCOL_VERSION/otelcol-contrib_${OTELCOL_VERSION}_linux_amd64.tar.gz" |
            tar xz -C "$HOME/bin" otelcol-contrib
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: fetch upstream adaptive/robust rules
        run: |
          mkdir -p poc/prometheus/vendor
          for f in adaptive robust; do
            curl -sSfL -o "poc/prometheus/vendor/$f.yml" \
              "https://raw.githubusercontent.com/grafana/promql-anomaly-detection/v$PROMQL_ANOMALY_DETECTION_VERSION/rules/$f.yml"
          done
      - name: promtool check rules
        run: promtool check rules poc/prometheus/anomaly-inputs.yml poc/prometheus/anomaly-alerts.yml poc/prometheus/vendor/*.yml anomalyd/test/e2e/rules.yml
      - name: promtool test rules
        working-directory: poc/prometheus/tests
        run: promtool test rules anomaly.test.yml e2e-adaptive.test.yml
      - name: amtool check-config
        run: amtool check-config poc/prometheus/alertmanager.yml anomalyd/test/e2e/alertmanager.yml
      - name: otelcol-contrib validate
        run: |
          for f in poc/otel/*.yaml anomalyd/test/bench/*.yaml; do
            echo "== $f"
            otelcol-contrib validate --config="$f"
          done
